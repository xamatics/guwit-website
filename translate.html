<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation Workbench — Guwit</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --ink:#16211E; --paper:#F2F3EF; --surface:#FFFFFF;
    --line:#DEE2DA; --muted:#68726D;
    --pine:#175E54; --pine-dk:#0F463E;
    --danger:#A3231C; --danger-sf:#FBEAE8;
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; height:100%;
    background:var(--paper); color:var(--ink);
    font-family:-apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  /* Frame fills the viewport minus a slim top bar so the tool feels native
     to the page rather than a widget dropped into a box. */
  .topbar {
    display:flex; align-items:center; gap:10px;
    height:48px; padding:0 16px; flex:none;
    border-bottom:1px solid var(--line); background:var(--surface);
  }
  .topbar .name { font-weight:600; font-size:14px; }
  .topbar .spacer { flex:1 1 auto; }
  .tool-links { display:flex; gap:8px; }
  .topbar a {
    font-size:13px; color:var(--muted); text-decoration:none;
    padding:6px 10px; border-radius:6px; border:1px solid var(--line);
  }
  .topbar a:hover { color:var(--ink); border-color:var(--pine); }
  .topbar a:focus-visible { outline:2px solid var(--pine); outline-offset:2px; }

  .frame-wrap {
    position:relative;
    height:calc(100vh - 48px);
    height:calc(100dvh - 48px);
  }
  iframe {
    width:100%; height:100%; border:0; display:block; background:var(--surface);
  }

  /* Loading state — shown until the app inside the iframe reports itself
     ready, so the page never looks frozen on a slow connection. */
  .loading {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:var(--paper); transition:opacity .25s ease;
  }
  .loading.hide { opacity:0; pointer-events:none; }
  .spinner {
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--pine);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading p { margin:0; font-size:13px; color:var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration:1.6s; }
  }

  /* Shown only if the iframe hasn't loaded after a timeout — most likely
     the Apps Script deployment requires a Google sign-in, which cannot be
     framed, or the deployment URL/access level changed. */
  .fallback {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:var(--paper); text-align:center; padding:24px;
  }
  .fallback.show { display:flex; }
  .fallback h2 { margin:0; font-size:16px; }
  .fallback p { margin:0; max-width:420px; font-size:13px; color:var(--muted); line-height:1.5; }
  .fallback a.btn {
    font-size:14px; font-weight:600; color:#fff; background:var(--pine);
    padding:10px 16px; border-radius:8px; text-decoration:none;
  }
  .fallback a.btn:hover { background:var(--pine-dk); }
</style>
</head>
<body>

  <div class="topbar">
    <span class="name">Translation Workbench</span>
    <span class="spacer"></span>
    <nav class="tool-links" aria-label="Related tools">
      <a href="https://guwit.com/guw.html" target="_blank" rel="noopener">Gungbe Translator/Converter</a>
      <a href="https://guwit.com/pcm.html" target="_blank" rel="noopener">Pidgin Converter</a>
    </nav>
  </div>

  <div class="frame-wrap">
    <div class="loading" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading the workbench…</p>
    </div>

    <div class="fallback" id="fallback">
      <h2>The workbench didn't load here</h2>
      <p>
        This usually means the deployment needs a Google sign-in, which
        Google doesn't allow inside an embedded page. Open it directly instead.
      </p>
      <a class="btn"
         href="https://script.google.com/macros/s/AKfycbzKDcKglWKzbw8SVDZdORGpXnITKrWm221fb5119Iig1n6TGwRONG6XFYKCZbXC_FQpSw/exec"
         target="_blank" rel="noopener">Open Translation Workbench</a>
    </div>

    <iframe
      id="app-frame"
      title="Universal Translation OS"
      src="https://script.google.com/macros/s/AKfycbzKDcKglWKzbw8SVDZdORGpXnITKrWm221fb5119Iig1n6TGwRONG6XFYKCZbXC_FQpSw/exec"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-write"
    ></iframe>
  </div>

  <script>
    (function () {
      var loading = document.getElementById('loading');
      var fallback = document.getElementById('fallback');
      var frame = document.getElementById('app-frame');
      var settled = false;

      function settle(ok) {
        if (settled) return;
        settled = true;
        loading.classList.add('hide');
        if (!ok) fallback.classList.add('show');
      }

      // The iframe's 'load' event fires once the document inside it (or a
      // sign-in error page) has loaded — either way, stop showing "loading".
      frame.addEventListener('load', function () { settle(true); });

      // Safety net: if 'load' never fires (blocked frame, network failure),
      // fall back to a direct link rather than spinning forever.
      window.setTimeout(function () { settle(!settled ? false : true); }, 12000);
    })();
  </script>

</body>
</html>
