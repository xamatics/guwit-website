<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">

<meta property="og:type" content="website">

<meta property="og:title" content="Gungbe Bénin Translator — Guwit Technology Solutions Ltd">
<meta property="og:description" content="Translate between English, French and Gungbe (Bénin) instantly.">
<meta property="og:url" content="https://guwit.com/guw.html">
<meta property="og:image" content="https://guwit.com/assets/img/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#7B5C9D">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="author" href="humans.txt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* Page-specific rules only — tokens, .site-header, .brand, .eyebrow,
     focus ring, etc. all come from assets/style.css. */

  html, body { height:100%; }

  .frame-wrap{
    --topbar-h:76px; /* matches .header-inner's fixed height in assets/style.css */
    position:relative;
    height:calc(100vh - var(--topbar-h));
    height:calc(100dvh - var(--topbar-h));
  }
  iframe{ width:100%; height:100%; border:0; display:block; background:var(--white); }

  .page-label{ flex:1 1 auto; min-width:0; }

  .loading{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:var(--paper); transition:opacity .25s ease;
  }
  .loading.hide{ opacity:0; pointer-events:none; }
  .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--plum);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading p{ margin:0; font-size:.85rem; color:var(--ink-soft); }

  .fallback{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:var(--paper); text-align:center; padding:28px;
  }
  .fallback.show{ display:flex; }
  .fallback h2{
    margin:0; font-family:var(--display); font-weight:600;
    font-size:1.3rem; color:var(--plum-ink);
  }
  .fallback p{ margin:0; max-width:420px; font-size:.9rem; color:var(--ink-soft); line-height:1.6; }
</style>
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="https://guwit.com/">
        <span class="brand-name">Guwit</span>
      </a>
      <div class="page-label">
        <span class="eyebrow">Gungbe Bénin Translator</span>
      </div>
    </div>
  </header>

  <div class="frame-wrap">
    <div class="loading" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading the translator…</p>
    </div>

    <div class="fallback" id="fallback">
      <h2>The translator is taking a while</h2>
      <p>
        Free-tier hosted spaces sometimes need a moment to wake up.
        Try again, or open it directly.
      </p>
      <a class="btn"
         href="https://xamatics-gungbebenintranslator.hf.space"
         target="_blank" rel="noopener">Open the Gungbe Translator</a>
    </div>

    <iframe
      id="app-frame"
      title="Gungbe Bénin Translator"
      src="https://xamatics-gungbebenintranslator.hf.space"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <script>
    (function () {
      var loading = document.getElementById('loading');
      var fallback = document.getElementById('fallback');
      var frame = document.getElementById('app-frame');
      var settled = false;

      function settle(ok) {
        if (settled) return;
        settled = true;
        loading.classList.add('hide');
        if (!ok) fallback.classList.add('show');
      }

      // The iframe's 'load' event fires once the space's document has
      // loaded — stop showing "loading" either way.
      frame.addEventListener('load', function () { settle(true); });

      // Safety net: hosted spaces on a free tier can take a while to wake
      // from a cold start, so this waits longer than a typical page before
      // offering the direct-open fallback instead of spinning forever.
      window.setTimeout(function () { settle(!settled ? false : true); }, 20000);
    })();
  </script>

</body>
</html>
